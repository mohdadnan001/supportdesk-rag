[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Customer support RAG pipeline with Streamlit UI, ChromaDB, and Groq"
readme = "README.md"
authors = [
    { name = "mohdadnan001", email = "mohdadnan786786a@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "groq>=1.7.0",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
